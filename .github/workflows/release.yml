name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/airwar-windows-x64 | Out-Null
          Copy-Item build/bin/Release/airwar.exe dist/airwar-windows-x64/
          Copy-Item plane.png,font.ttf,image.png,README.md,LICENSE dist/airwar-windows-x64/
          Compress-Archive -Path dist/airwar-windows-x64 -DestinationPath dist/airwar-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: airwar-windows-x64
          path: dist/airwar-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libudev-dev libgl1-mesa-dev libfreetype6-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p dist/airwar-linux-x64
          cp build/bin/airwar dist/airwar-linux-x64/
          cp plane.png font.ttf image.png README.md LICENSE dist/airwar-linux-x64/
          tar -C dist -czf dist/airwar-linux-x64.tar.gz airwar-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: airwar-linux-x64
          path: dist/airwar-linux-x64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi